# voron0-dockprobe – KlipperScreen-Menü (Deutsch)
# SPDX-License-Identifier: GPL-3.0-or-later
# Wird von install.sh in KlipperScreen.conf eingebunden und von uninstall.sh wieder entfernt.
# Der Z-Endstop-Papiertest öffnet automatisch das Z-Kalibrier-Panel von KlipperScreen.

[menu __main more dockprobe]
name: Probe
icon: z-tilt
enable: {{ 'ATTACH_PROBE' in printer.gcode_macros.list }}

[menu __main more dockprobe attach]
name: Probe andocken
icon: arrow-up
method: printer.gcode.script
params: {"script": "ATTACH_PROBE"}

[menu __main more dockprobe detach]
name: Probe ablegen
icon: arrow-down
method: printer.gcode.script
params: {"script": "DETACH_PROBE"}

[menu __main more dockprobe status]
name: Probe-Status
icon: info
method: printer.gcode.script
params: {"script": "PROBE_STATUS"}

[menu __main more dockprobe docktest]
name: Dock-Test
icon: shuffle
method: printer.gcode.script
params: {"script": "DOCK_TEST CYCLES=3 F=1500"}
confirm: Probe 3x mit 1500 mm/min an- und ablegen?

[menu __main more dockprobe accuracy]
name: Genauigkeit
icon: fine-tune
method: printer.gcode.script
params: {"script": "PROBE_ACCURACY SAMPLES=10"}

[menu __main more dockprobe screws]
name: Bettschrauben
icon: bed-level
method: printer.gcode.script
params: {"script": "SCREWS_TILT_CALCULATE"}

[menu __main more dockprobe paper]
name: Z-Endstop Papiertest
icon: z-farther
method: printer.gcode.script
params: {"script": "CALIBRATE_Z_ENDSTOP"}

[menu __main more dockprobe zoffset]
name: z_offset prüfen
icon: z-closer
method: printer.gcode.script
params: {"script": "MEASURE_PROBE_OFFSET"}

[menu __main more dockprobe mesh]
name: Bed Mesh
icon: bed-mesh
method: printer.gcode.script
params: {"script": "BED_MESH_CALIBRATE"}
confirm: Neues Bed Mesh messen?

[menu __main more dockprobe all]
name: Komplett-Kalibrierung
icon: complete
method: printer.gcode.script
params: {"script": "CALIBRATE_ALL BED=60 SOAK=10"}
confirm: Bett auf 60 °C heizen, 10 min warten, Schrauben prüfen und Mesh messen?

[menu __main more dockprobe guard]
name: Druckschutz prüfen
icon: lock
method: printer.gcode.script
params: {"script": "PROBE_GUARD"}
