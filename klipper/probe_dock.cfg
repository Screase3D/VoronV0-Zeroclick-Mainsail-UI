# =====================================================================
#  voron0-dockprobe – Macro-Logik / macro logic
#
#  Diese Datei wird über Updates gepflegt (Symlink ins Repo).
#  NICHT bearbeiten – deine Werte stehen in probe_dock_settings.cfg.
#  Maintained via updates (symlink to the repo). Do NOT edit –
#  your values live in probe_dock_settings.cfg.
#  Sprache der Meldungen / message language: variable_lang in _PROBE_VARS
#
#  Befehle:
#    CALIBRATE_ALL [BED=60] [SOAK=5] [SCREWS=1] [MESH=1] [PROFILE=default] [SAVE=0]
#    BED_MESH_CALIBRATE [ADAPTIVE=1] ...   (holt/bringt Probe selbst)
#    SCREWS_TILT_CALCULATE                  (holt/bringt Probe selbst)
#    PROBE_ACCURACY [SAMPLES=10]            (holt/bringt Probe selbst)
#    MEASURE_PROBE_OFFSET                   (misst Auslösehöhe der Probe)
#    CALIBRATE_Z_ENDSTOP                    (Papiertest für den First Layer)
#    ATTACH_PROBE [FORCE=1] [F=mm/min] / DETACH_PROBE [FORCE=1] [F=mm/min]
#    DOCK_TEST [CYCLES=3] [F=1500]          (Andocken/Ablegen wiederholt prüfen)
#    PROBE_STATUS
#
#  PROBE_CALIBRATE ist gesperrt: die Probe hängt unter der Düse und
#  würde beim Papiertest ins Bett fahren.
# =====================================================================


# ---------------------------------------------------------------------
# Status
# ---------------------------------------------------------------------
[gcode_macro _PROBE_STATE]
variable_attached: False
gcode:

[gcode_macro PROBE_STATUS]
description: Probe-Status prüfen / check probe state
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% if printer["gcode_macro _PROBE_VARS"].verify %}
        M400
        QUERY_PROBE
        _PROBE_SYNC
    {% else %}
        {action_respond_info(("Probe attached (stored state): %s" if en else "Probe angedockt (gespeicherter Status): %s") % printer["gcode_macro _PROBE_STATE"].attached)}
    {% endif %}

# Status beim Klipper-Start aus dem Probe-Pin übernehmen
[delayed_gcode _PROBE_INIT]
initial_duration: 2
gcode:
    {% if printer["gcode_macro _PROBE_VARS"].verify %}
        QUERY_PROBE
        _PROBE_SYNC
    {% endif %}

[gcode_macro _PROBE_SYNC]
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set attached = not printer.probe.last_query %}
    SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=attached VALUE={attached}
    {% if attached %}
        {action_respond_info("WARNING: probe is attached to the toolhead" if en else "ACHTUNG: Probe hängt am Toolhead")}
    {% else %}
        {action_respond_info("Probe is docked" if en else "Probe ist im Dock")}
    {% endif %}

[gcode_macro _PROBE_CHECK]
gcode:
    {% if printer["gcode_macro _PROBE_VARS"].verify %}
        M400
        G4 P200
        QUERY_PROBE
        _PROBE_CHECK_2 EXPECT={params.EXPECT}
    {% endif %}

[gcode_macro _PROBE_CHECK_2]
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set attached = not printer.probe.last_query %}
    SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=attached VALUE={attached}
    {% if params.EXPECT == "attached" and not attached %}
        _PROBE_ABORT MSG="{'Probe was not picked up - check the dock' if en else 'Probe wurde nicht aufgenommen - Dock pruefen'}"
    {% elif params.EXPECT == "docked" and attached %}
        _PROBE_ABORT MSG="{'Probe is still attached to the toolhead - check the dock' if en else 'Probe haengt noch am Toolhead - Dock pruefen'}"
    {% endif %}

[gcode_macro _PROBE_ABORT]
gcode:
    {action_raise_error(params.MSG|default("Probe error / Probe-Fehler"))}

[gcode_macro _PROBE_HOME_IF_NEEDED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


# ---------------------------------------------------------------------
# Andocken / Ablegen
#   Andocken: Vorposition rechts -> Dock-Y -> nach links ins Dock ->
#             nach rechts heraus
#   Ablegen:  Vorposition rechts -> Dock-Y -> nach links ins Dock ->
#             in Y wegfahren (löst die Magnetverbindung)
# ---------------------------------------------------------------------
[gcode_macro ATTACH_PROBE]
description: Probe aus dem Dock holen / attach probe
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    {% set force = params.FORCE|default(0)|int %}
    {% set tf = params.F|default(v.travel_f)|float %}
    {% set df = params.F|default(v.dock_f)|float %}
    {% if printer["gcode_macro _PROBE_STATE"].attached and not force %}
        {action_respond_info("Probe is already attached" if en else "Probe ist bereits angedockt")}
    {% else %}
        _PROBE_HOME_IF_NEEDED
        SAVE_GCODE_STATE NAME=attach_probe_state
        G90
        G0 Z{v.safe_z} F{v.z_f}
        G0 Y{v.safe_y} F{tf}
        G0 X{v.safe_x} Y{v.safe_y} F{tf}
        G0 X{v.dock_x + v.approach_dx} Y{v.staging_y} F{tf}
        G0 Y{v.dock_y} F{df}
        G0 X{v.dock_x} F{df}
        G0 X{v.dock_x + v.approach_dx} F{df}
        G0 X{v.safe_x} Y{v.safe_y} F{tf}
        RESTORE_GCODE_STATE NAME=attach_probe_state
        SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=attached VALUE=True
        _PROBE_CHECK EXPECT=attached
    {% endif %}

[gcode_macro DETACH_PROBE]
description: Probe zurück ins Dock bringen / dock probe
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    {% set force = params.FORCE|default(0)|int %}
    {% set tf = params.F|default(v.travel_f)|float %}
    {% set df = params.F|default(v.dock_f)|float %}
    {% if not printer["gcode_macro _PROBE_STATE"].attached and not force %}
        {action_respond_info("Probe is already docked" if en else "Probe ist bereits im Dock")}
    {% else %}
        _PROBE_HOME_IF_NEEDED
        SAVE_GCODE_STATE NAME=detach_probe_state
        G90
        G0 Z{v.safe_z} F{v.z_f}
        G0 Y{v.safe_y} F{tf}
        G0 X{v.safe_x} Y{v.safe_y} F{tf}
        G0 X{v.dock_x + v.approach_dx} Y{v.staging_y} F{tf}
        G0 Y{v.dock_y} F{df}
        G0 X{v.dock_x} F{df}
        G0 Y{v.staging_y} F{df}
        G0 X{v.safe_x} Y{v.safe_y} F{tf}
        RESTORE_GCODE_STATE NAME=detach_probe_state
        SET_GCODE_VARIABLE MACRO=_PROBE_STATE VARIABLE=attached VALUE=False
        _PROBE_CHECK EXPECT=docked
    {% endif %}


# ---------------------------------------------------------------------
# Overrides – holen die Probe selbst und bringen sie nur zurück,
# wenn sie vorher nicht schon angedockt war
# ---------------------------------------------------------------------
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Bed Mesh mit Probe-Handling / bed mesh with probe handling
gcode:
    {% set was_attached = printer["gcode_macro _PROBE_STATE"].attached %}
    _PROBE_HOME_IF_NEEDED
    ATTACH_PROBE
    _BED_MESH_CALIBRATE_BASE {rawparams}
    {% if not was_attached %}
        DETACH_PROBE
    {% endif %}

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE_BASE
description: Schrauben-Check / bed screw check
gcode:
    {% set was_attached = printer["gcode_macro _PROBE_STATE"].attached %}
    _PROBE_HOME_IF_NEEDED
    ATTACH_PROBE
    _SCREWS_TILT_CALCULATE_BASE {rawparams}
    {% if not was_attached %}
        DETACH_PROBE
    {% endif %}

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY_BASE
description: Probe-Genauigkeit messen / probe accuracy
gcode:
    {% set was_attached = printer["gcode_macro _PROBE_STATE"].attached %}
    _PROBE_HOME_IF_NEEDED
    ATTACH_PROBE
    _PROBE_ACCURACY_BASE {rawparams}
    {% if not was_attached %}
        DETACH_PROBE
    {% endif %}

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE_BASE
description: Gesperrt / locked – MEASURE_PROBE_OFFSET nutzen / use MEASURE_PROBE_OFFSET
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {action_raise_error("PROBE_CALIBRATE locked (probe hangs below the nozzle). Use instead: CALIBRATE_Z_ENDSTOP, then MEASURE_PROBE_OFFSET" if en else "PROBE_CALIBRATE gesperrt (Probe hängt unter der Düse). Stattdessen: CALIBRATE_Z_ENDSTOP, dann MEASURE_PROBE_OFFSET")}


# ---------------------------------------------------------------------
# Kalibrierung
# ---------------------------------------------------------------------
[gcode_macro CALIBRATE_Z_ENDSTOP]
description: Z-Endstop-Papiertest / Z endstop paper test
gcode:
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    _PROBE_HOME_IF_NEEDED
    DETACH_PROBE
    G90
    G0 X{v.safe_x} Y{v.safe_y} F{v.travel_f}
    Z_ENDSTOP_CALIBRATE

[gcode_macro MEASURE_PROBE_OFFSET]
description: Auslösehöhe der Probe messen / measure probe trigger height
gcode:
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    _PROBE_HOME_IF_NEEDED
    ATTACH_PROBE
    G90
    G0 X{v.safe_x} Y{v.safe_y} F{v.travel_f}
    PROBE
    G0 Z{v.safe_z} F{v.z_f}
    DETACH_PROBE
    _MEASURE_PROBE_OFFSET_REPORT

[gcode_macro _MEASURE_PROBE_OFFSET_REPORT]
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set zo = printer.configfile.settings.probe.z_offset %}
    {action_respond_info(("New z_offset = %.3f + reported z (about 0 means it fits)" if en else "Neuer z_offset = %.3f + gemeldetes z (bei ca. 0 passt alles)") % zo)}

[gcode_macro CALIBRATE_ALL]
description: Komplett-Kalibrierung / full calibration
gcode:
    {% set bed     = params.BED|default(0)|int %}
    {% set soak    = params.SOAK|default(0)|int %}
    {% set screws  = params.SCREWS|default(1)|int %}
    {% set mesh    = params.MESH|default(1)|int %}
    {% set profile = params.PROFILE|default("default") %}
    {% set save    = params.SAVE|default(0)|int %}
    G28
    {% if bed > 0 %}
        M190 S{bed}
        {% if soak > 0 %}
            G4 P{soak * 60000}
        {% endif %}
        G28 Z
    {% endif %}
    ATTACH_PROBE
    {% if screws %}
        BED_MESH_CLEAR
        SCREWS_TILT_CALCULATE
        _CAL_SCREWS_EVAL
    {% endif %}
    {% if mesh %}
        BED_MESH_CALIBRATE PROFILE={profile}
    {% endif %}
    DETACH_PROBE
    {% if save %}
        SAVE_CONFIG
    {% endif %}

[gcode_macro _CAL_SCREWS_EVAL]
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    {% set res = printer.screws_tilt_adjust.results %}
    {% set ns = namespace(base=none, maxd=0.0) %}
    {% for name in res %}
        {% if res[name].is_base %}
            {% set ns.base = res[name].z %}
        {% endif %}
    {% endfor %}
    {% if ns.base is not none %}
        {% for name in res %}
            {% set d = (res[name].z - ns.base)|abs %}
            {% if d > ns.maxd %}
                {% set ns.maxd = d %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if ns.maxd > v.max_screw_dev %}
        DETACH_PROBE
        {% if en %}
            _PROBE_ABORT MSG="Bed not level ({'%.3f' % ns.maxd} mm) - turn screws as shown, then recalibrate the Z endstop"
        {% else %}
            _PROBE_ABORT MSG="Bett schief ({'%.3f' % ns.maxd} mm) - Schrauben laut Anzeige drehen, dann Z-Endstop neu kalibrieren"
        {% endif %}
    {% else %}
        {action_respond_info(("Screws ok (max %.3f mm)" if en else "Schrauben ok (max %.3f mm)") % ns.maxd)}
    {% endif %}


# ---------------------------------------------------------------------
# Dock-Test: mehrfach andocken und ablegen, jede Bewegung wird geprüft
# ---------------------------------------------------------------------
[gcode_macro DOCK_TEST]
description: Dock-Test (mehrfach andocken/ablegen) / dock reliability test
gcode:
    {% set n = params.CYCLES|default(3)|int %}
    {% set f = params.F|default(0)|int %}
    {% set fp = (" F=%d" % f) if f > 0 else "" %}
    _PROBE_HOME_IF_NEEDED
    DETACH_PROBE{fp}
    {% for i in range(n) %}
        ATTACH_PROBE{fp}
        DETACH_PROBE{fp}
        _DOCK_TEST_STEP I={i + 1} N={n}
    {% endfor %}
    _DOCK_TEST_DONE N={n}

[gcode_macro _DOCK_TEST_STEP]
gcode:
    {% set en = printer["gcode_macro _PROBE_VARS"].lang|default("de") == "en" %}
    {action_respond_info(("Dock test: cycle %s/%s ok" if en else "Dock-Test: Zyklus %s/%s ok") % (params.I, params.N))}

[gcode_macro _DOCK_TEST_DONE]
gcode:
    {% set v = printer["gcode_macro _PROBE_VARS"] %}
    {% set en = v.lang|default("de") == "en" %}
    {% if v.verify %}
        {action_respond_info(("Dock test passed: %s cycles" if en else "Dock-Test bestanden: %s Zyklen") % params.N)}
    {% else %}
        {action_respond_info(("Dock test finished: %s cycles (no pin check, verify = False)" if en else "Dock-Test beendet: %s Zyklen (ohne Pin-Prüfung, verify = False)") % params.N)}
    {% endif %}
